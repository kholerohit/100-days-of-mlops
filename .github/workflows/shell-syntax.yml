name: Shell syntax

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Check shell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse shell scripts with Bash
        run: |
          printf '\033[1mWelcome to MLOps Practice, testing like a hacker!\033[0m\n'
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -n